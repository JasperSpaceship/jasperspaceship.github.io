<header class="navbar">
    <div class="navbar-left">
        <img src="./public/assets/images/logo/minimalist.png" alt="Jasper" class="logo">
        <button type="button" class="menu-icon" id="menuIcon" aria-controls="sidebar" aria-expanded="false"
            aria-label="Abrir menu">☰</button>
    </div>

    <div class="navbar-right">
        <a class="button"
            href="https://discord.com/api/oauth2/authorize?client_id=528176898384068621&permissions=414467869760&scope=bot%20applications.commands"
            target="_blank" rel="noopener">+ Adicionar a Jasper</a>
    </div>
</header>

<aside id="sidebar" class="sidebar">
    <a href="./">Página Inicial</a>
    <a href="./shop">Lojinha</a>
    <a href="./idle">Idle Diamond Simulator</a>
    <a href="./aquarela">Aquarela de Cargos</a>
    <a href="./birthdays">Locutor de Aniversários</a>
    <a href="./privacy-policy">Política de Privacidade</a>
    <a href="./thanks">Créditos & Agradecimentos</a>
</aside>

<div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>

<script>
    (function () {
        var sidebar = document.getElementById("sidebar");
        var toggle = document.getElementById("menuIcon");
        var backdrop = document.getElementById("sidebarBackdrop");

        function setMenu(open) {
            sidebar.classList.toggle("open", open);
            backdrop.classList.toggle("visible", open);
            backdrop.hidden = !open;
            document.body.classList.toggle("menu-open", open);
            toggle.setAttribute("aria-expanded", String(open));
            toggle.setAttribute("aria-label", open ? "Fechar menu" : "Abrir menu");
        }

        toggle.addEventListener("click", function () {
            setMenu(!sidebar.classList.contains("open"));
        });

        backdrop.addEventListener("click", function () {
            setMenu(false);
        });

        // Garante que o menu seja fechado ao navegar para uma nova página
        sidebar.querySelectorAll("a").forEach(function (link) {
            link.addEventListener("click", function () {
                setMenu(false);
            });
        });

        document.addEventListener("keydown", function (event) {
            if (event.key === "Escape" && sidebar.classList.contains("open")) {
                setMenu(false);
                toggle.focus();
            }
        });
    })();
</script>
